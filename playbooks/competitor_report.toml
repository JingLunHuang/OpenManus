# 競品分析報告 —— 課程案例二。
# 經驗：① 把"收集資訊"拆得過細會迅速耗盡步數；② 搜尋結果裡的新聞常常過時，報告失真。
# 因此：先定計劃、按"公司 × 維度"成批檢索；每條資料必須帶來源與日期，並優先近 12 個月的資料。

id = "competitor-report"
title = "競品分析報告"
profile = "research"
triggers = ["競品", "競爭對手", "對比分析", "市場分析", "行業分析", "調研報告", "分析報告"]
sites = []
date_preference = "nearest"
tips = [
  "以當前日期為基準判斷時效：超過 12 個月的資料要標註'可能過時'，並儘量找更新的來源替代。",
  "區分'事實（有來源）'與'推斷（你的分析）'，不要把推斷寫成事實。",
  "web_search 只給線索，關鍵數字請 web_open 開啟原始來源後用 web_read 提取，提取結果會自動記入發現板。",
]

[route]
steps = [
  "用 plan 制定 4~6 項計劃：每個競品一項資訊收集 + 對比維度 + 撰寫報告。",
  "對每個競品按維度檢索：產品線與定價、銷量/市場份額、渠道與本地化、技術與合規、近期動態。",
  "關鍵資料用 web_read 從來源頁提取；發現板裡的事實足夠支撐結論後就停止檢索。",
  "用 files write 寫 Markdown 報告：摘要、對比表、逐項分析、風險與建議、參考來源（含日期）。",
  "finish 時給出報告路徑與 3~5 條核心結論。",
]
